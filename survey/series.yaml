# Every series of competitions at which senior individual track races have been run, 1896-2026.
#
# The search space of Splits: what could, in principle, have published split times. Researched
# on 2026-10-01 by six independent sweeps (global championships, one-day circuits, continental and
# regional events, national and collegiate events, where the all-time top performances were run,
# and who published splits), four rounds of a completeness critic, and a consolidation pass.
#
# scope: elite-core (the top of the sport in its era), elite-secondary (continental championships
# and games, second-tier circuits, national championships whose fields are world class, NCAA),
# sub-elite (the rest), out-of-scope (only relays, walks, road, field, age-group or para races).
# merged_from lists the researchers' ids folded into each series; sources are the pages they
# relied on. editions_estimate is the researchers' count, not a measurement: survey/editions.csv
# holds the editions actually enumerated.

