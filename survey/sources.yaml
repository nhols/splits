# Who has published split times for elite track races, for which competitions and in which years:
# the bound on what Splits can ever retrieve. Researched on 2026-10-01 (a dedicated sweep, plus
# sources the other sweeps met on the way). Per-category, era-by-era availability is in
# survey/availability.yaml.

- id: wa-championship-race-analyses
  publisher: World Athletics (timing and data by SEIKO)
  kind: official-race-analysis
  covers:
  - world-championships
  - world-indoor-championships
  - ultimate-championship
  years: WCh 2013, 2015, 2017, 2019, 2022, 2023, 2025; WIC 2024-2026; WUC 2026
  events_and_granularity: '2013: RS7 split times for the 100m (error-prone). 2015/2017: RS5 with coarse
    400m/1000m points for 800m+. 2019: RS5 for 800m-10,000m every 100m. 2022/23/25: RS5 for 200m, 400m,
    400mH, 800m-10,000m and steeple. WIC from 2024: 400m-3000m. Never 60m, 100m or sprint hurdles.'
  access: public
  urls:
  - https://worldathletics.org/competitions/world-athletics-championships
  - https://media.aws.iaaf.org/competitiondocuments
  notes:
  - The documents are listed in each WA results page (__NEXT_DATA__ documents) and stored on media.aws.iaaf.org/competitiondocuments.
    WCh 1983-2011 have only results (RS6/RS1) with the leader's intermediate times.
- id: wa-competition-documents
  publisher: World Athletics (media.aws.iaaf.org/competitiondocuments)
  kind: official-race-analysis
  covers:
  - world-championships
