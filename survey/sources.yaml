  - ultimate-championship
  - olympic-games
  years: 2013-2026
  events_and_granularity: RS5 race analysis for 200m-10,000m, 400mH, SC (100m checkpoints for distance)
    at WCh 2022-25; 800m+ only 2019; coarse 2015/2017; RS7 100m splits 2013; WIC 400m-3000m from 2024.
    Never 100m, sprint hurdles, 60m.
  access: public
  urls:
  - https://media.aws.iaaf.org/competitiondocuments/pdf/7212925/AT-800-M-f--1--.RS5.pdf
  notes:
  - Olympic ORIS files for Tokyo 2020 (7132391, RS7) and Paris 2024 (7153115, RS5) are hosted unlisted
    under the same path.
