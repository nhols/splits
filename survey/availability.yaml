# For each elite series, era by era: were split times published, for which events and
# rounds, at what granularity, and where they can be found. Researched 2026-10-01.

- series: aaa-championships
  summary: No official per-runner splits are known for any AAA Championships. From 1945 Athletics Weekly's
    reports give the leader's intermediate times for 800 m and longer races. The 1984 issue has 1500 m
    400/800/1200 m leader splits to 0.01 s and 5000 m kilometre splits with leader names. The AW archive
    is subscription-only, although issue PDFs sit at public URLs. No data was found for 1880-1944.
  eras:
  - from_year: 1880
    to_year: 1944
    status: unknown
    disciplines: []
    all_rounds: false
    events: Not established. Newspaper reports (The Times, Sporting Life) may give leader quarter-mile
      times in mile races, but none was checked.
    granularity: unknown
    rounds: unknown
    publisher: unknown (press)
    urls: []
    notes: Not searched edition by edition. No pre-AW split source was found.
  - from_year: 1945
    to_year: 2006
    status: leader-splits-only
    disciplines: []
    all_rounds: false
    events: '800 m and longer in press reports: 800 m first lap, 1500 m 400/800/1200 m, 5000 m per km,
      with the leader named. No splits for sprints or hurdles.'
    granularity: leader at selected points; 0.01 s in the electronically timed era (1984 checked), hand
      times earlier
    rounds: mainly finals; some heats are described (1984 1500 m)
    publisher: Athletics Weekly (unofficial press report)
    urls:
    - https://athleticsweekly.com/wp-content/uploads/securepdfs/2025/06/June-30-1984-Vol-38-No-26.pdf
    - https://athleticsweekly.com/archives/
    - https://athleticsweekly.com/news/access-the-aw-archive-now-1039990057/
    notes: Only 1984 was verified. Coverage varies by issue. The AW archive is paid (£3.99/month), but
      some PDFs load directly. No official UKA/AAA split sheets were found for 1990-2006.
