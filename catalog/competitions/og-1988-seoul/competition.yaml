# Olympic Games Seoul 1988
# No race documents from these Games are online. The finals with splits come from World
# Athletics' statistics handbook for Tokyo 2020, which gives the result of every Olympic final
# and, for many of them, the times at halfway or a table of splits: Griffith Joyner's world
# record in the 200m (page 102), the women's 100m every 20m, and the 400m to the 3000m and
# steeplechase.
