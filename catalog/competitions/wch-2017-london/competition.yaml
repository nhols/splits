# IAAF World Championships London 2017
# Documents listed on World Athletics' results pages, written by `splits discover`; race keys
# are <discipline>-<sex>/<round>[-<heat>]. In 2017 only the 800 m and longer were analysed,
# coarsely: 400 m in the 800 m, every 400 m in the 1500 m, every 1000 m from the 5000 m.
# The 100 m finals, declared by hand, have no race analysis: their times every 10 m come from
# the biomechanics reports Leeds Beckett University wrote for World Athletics, measured from
# video (pages 1, 15 and 18: the title, the section on the final, Table 2.2).
id: wch-2017-london
