# Olympic Games Rio 2016
# The Games' own documents are no longer online, but their Athletics Results Book survives in
# the Wayback Machine: every race analysis (report C77A: the 800 m and longer; no sprint was
# analysed) and the results of its round, the pages written by `splits discover` from the
# book's own page footers. The sprint finals, which no race analysis covers, come from World
# Athletics' statistics handbook for Tokyo 2020, which gives their halves: the men's 400m, a
# world record (page 202, with 300m splits), the women's 400m (100m, 200m and 300m) and both
# 200m finals.
