# IAAF World Championships Berlin 2009
# World Athletics published no race analyses in 2009. The splits come from the biomechanics
# project the German Athletics Federation (DLV) ran at the championships, measured from video:
# its reports on the men's sprints, the men's hurdles, and the women's sprints and hurdles
# (World Athletics' research centre, reports 1 to 3) give reaction times and splits for most
# runners of every round of the 100 m, 200 m, 400 m and hurdles: every 20 m in the 100 m, 50 m
# in the 200 m, 100 m in the 400 m, and at each hurdle. Each race's results are World
# Athletics' official results of its round. Left out: the relays, and the combined events'
# races (report 9).
