# IAAF World Athletics Championships Doha 2019
# Documents listed on World Athletics' results pages, written by `splits discover`; race keys
# are <discipline>-<sex>/<round>[-<heat>]. Each race has its race analysis (splits) and its
# results (lanes, reaction times). In 2019 only the 800 m and longer were analysed.
id: wch-2019-doha
name: IAAF World Athletics Championships Doha 2019
series: world-championships
start_date: 2019-09-27
end_date: 2019-10-06
venue:
  name: Khalifa International Stadium
  city: Doha
  country: QAT
setting: outdoor
timezone: Asia/Qatar
results_url: https://worldathletics.org/competitions/world-athletics-championships/iaaf-world-athletics-championships-doha-2019-7125365/results
world_athletics: 7125365

excluded:
  - race: 100m-men/heat-5
    reason: the document listed as its race analysis has no checkpoints, only the result
  - race: 100m-women/heat-5
    reason: the document listed as its race analysis has no checkpoints, only the result

