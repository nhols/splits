# Olympic Games Tokyo 2020, held in 2021
# Written by `splits discover` from the results site's own index of its documents (kept by the
# Wayback Machine): every race analysis the Games published (report C77A: the 800 m and longer,
# and two heats of the men's 400m hurdles; the men's 10,000m and third steeplechase heat had
# none), with the results of its round. World Athletics keeps the Games' documents, byte for
# byte, on its own server: entries declare that copy, and the Wayback Machine's where it has
# one. The men's 400m hurdles final, a world record, has official results but no race analysis.
