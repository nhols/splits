# What is raced. Distances are in metres.
#
# Barrier layouts follow the World Athletics Technical Rules (TR 22): `first` is the distance
# from the start to the first barrier, `spacing` the distance between barriers, `height` the
# barrier height. A document that times athletes "at hurdle 3" is resolved to a distance here.

