# World Athletics made the 300 m hurdles an official event in 2025: seven flights, 50 m to the
# first, 35 m apart, 40 m from the last to the finish.
- id: 300mh
  name: 300 metres hurdles
  short_name: 300mH
  kind: hurdles
  distance: 300
  barriers:
    men: {count: 7, first: 50, spacing: 35, height: 0.914}
