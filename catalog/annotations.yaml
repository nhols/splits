# Anti-doping rules
- code: ADR10.1
  meaning: Results disqualified for an anti-doping rule violation at the event
  source: World Athletics Anti-Doping Rules, Article 10.1
- code: ADR10.8
  meaning: Results annulled for an anti-doping rule violation (from the date of the sample or violation)
  source: World Athletics Anti-Doping Rules (2015 edition), Article 10.8
- code: Rule10.1
  meaning: Disqualified under the anti-doping rules (provisionally suspended)
  source: "Document's note: the athlete has been provisionally suspended"

