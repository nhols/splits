# Identity rules, for when the documents and World Athletics alone would identify an athlete
# wrongly.
#
# Athletes are identified by World Athletics: every row matched to a result of World Athletics'
# own results of the competition (by time, country and name) is that World Athletics athlete,
# whatever name and country the document prints, and the athlete ID is the slug of the name
# World Athletics gives them now (georgia-hunter-bell). The IDs of their other printed names
# (georgia-bell) redirect to them. A row World Athletics does not list is the athlete its
# printed name and country are linked to elsewhere; failing that, the athlete of that name and
# country, compared case- and accent-insensitively in any order ("WARHOLM Karsten" and
# "Karsten WARHOLM" are the same person), with the slug of the name as ID.
#
# Add a rule here when that goes wrong:
#
#   - rows World Athletics does not list print another name or country (a team code of the
#     past, a refugee team): list them under also_known_as;
#   - two athletes share a name: give each a rule with a distinct id;
#   - World Athletics does not list the athlete at all (an Olympic final before 1996): give
#     their World Athletics ID, the number ending their profile URL, as world_athletics;
#   - the display spelling cannot be recovered from capitals (McMASTER vs MCMASTER).
#
# Example:
#   - id: carl-lewis
#     given: Carl
#     family: Lewis
#     country: USA
#     world_athletics: 14244008

# Refugee athletes run for a team rather than a country, coded by the event: the Refugee
