# Identity rules, for when printed names alone would identify an athlete wrongly.
#
# By default an athlete is identified by the name and country printed in documents,
# compared case- and accent-insensitively, whatever order the document prints them in
# ("WARHOLM Karsten" and "Karsten WARHOLM" are the same person). The athlete ID is the
# slug of the name, e.g. karsten-warholm. Add a rule here when that default goes wrong:
#
#   - the athlete's name changed, or is spelled differently by different publishers:
#     list the other spellings under also_known_as;
#   - two athletes share a name: give each a rule with a distinct id;
#   - the display spelling cannot be recovered from capitals (McMASTER vs MCMASTER).
#
# Example:
#   - id: sydney-mclaughlin-levrone
#     given: Sydney
#     family: McLaughlin-Levrone
#     country: USA
#     also_known_as:
#       - {given: Sydney, family: McLaughlin}

- id: ramil-guliyev
  given: Ramil
  family: Guliyev
  country: TUR
  also_known_as:
    # He ran for Azerbaijan until 2011 (the 2009 World Championships).
    - {given: Ramil, family: Guliyev, country: AZE}

