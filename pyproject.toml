[project]
name = "splits"
version = "0.1.0"
description = "A provenance-first database of split times from elite track races."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.3",
    "httpx>=0.28",
    "pdfplumber>=0.11.4",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "typer>=0.16",
]

[project.scripts]
splits = "splits.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splits"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]
# Typography used on purpose: en dashes in ranges ("100m–200m"), curly apostrophes and the
# dotless i that athlete names are printed with.
allowed-confusables = ["–", "’", "ı"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
